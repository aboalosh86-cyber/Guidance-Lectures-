<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الانضباط المدرسي - 15 شريحة</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Tahoma,Arial,sans-serif}
.slide{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  background:#fff;
}
.slide.active{display:flex}
.slide img{
  width:100vw;height:100vh;
  object-fit:contain;
  object-position:center;
  display:block;
  background:#fff;
}
#progress{
  position:fixed;top:0;right:0;height:4px;
  background:#0d2b47;z-index:20;transition:width .2s ease;
}
.nav{
  position:fixed;bottom:10px;z-index:30;
  border:0;border-radius:12px;padding:9px 15px;
  font-weight:800;font-size:14px;cursor:pointer;
  opacity:.72;backdrop-filter:blur(6px);
}
#prev{left:12px;background:rgba(255,255,255,.90);color:#173044;border:1px solid #d7e1e7}
#next{right:12px;background:rgba(13,43,71,.92);color:white}
#count{
  position:fixed;left:50%;bottom:11px;transform:translateX(-50%);
  z-index:30;background:rgba(255,255,255,.92);color:#173044;
  border:1px solid #d7e1e7;border-radius:999px;padding:6px 11px;
  font-size:13px;font-weight:800;
}
#fs{
  position:fixed;left:10px;top:10px;z-index:30;
  width:36px;height:36px;border:1px solid #d7e1e7;border-radius:10px;
  background:rgba(255,255,255,.86);color:#173044;font-size:18px;cursor:pointer;
  opacity:.68;
}
@media(max-width:700px){
  .nav{bottom:7px;padding:8px 12px;font-size:12px}
  #count{bottom:8px;font-size:12px}
}
</style>

<style id="global-mobile-controls-v1">
/* كل محاضرة لها زر ملء شاشة قديم؛ نخفيه ونستخدم زر البرنامج الخارجي فقط */
#fullscreen,#fs,#full{
  display:none!important;
}

/* عداد الشرائح مستقل وواضح وبعيد عن النص */
#count,#counter{
  position:fixed!important;
  left:50%!important;
  right:auto!important;
  bottom:max(12px,env(safe-area-inset-bottom))!important;
  transform:translateX(-50%)!important;
  z-index:9999!important;
  width:auto!important;
  max-width:44vw!important;
  margin:0!important;
  padding:5px 11px!important;
  background:#0d2b47!important;
  color:#fff!important;
  border:1px solid #e6b84b!important;
  border-radius:999px!important;
  box-shadow:0 3px 10px rgba(13,43,71,.26)!important;
  font-family:"Cairo",Tahoma,Arial,sans-serif!important;
  font-size:11px!important;
  font-weight:800!important;
  line-height:1.25!important;
  white-space:nowrap!important;
  text-align:center!important;
  pointer-events:none!important;
}

/* السابق/التالي يبقيان قابلين للضغط حتى في وضع العرض */
#prev,#next{
  position:fixed!important;
  bottom:max(8px,env(safe-area-inset-bottom))!important;
  z-index:10000!important;
  margin:0!important;
  min-height:40px!important;
  padding:8px 12px!important;
  border-radius:11px!important;
  font-family:"Cairo",Tahoma,Arial,sans-serif!important;
  font-size:13px!important;
  font-weight:800!important;
  pointer-events:auto!important;
  touch-action:manipulation!important;
}
#prev{left:8px!important;right:auto!important}
#next{right:8px!important;left:auto!important}

/* إذا للمحاضرة شريط سفلي أصلي، نحوله لخلفية ثابتة رقيقة فقط */
.controls{
  position:fixed!important;
  left:0!important;
  right:0!important;
  bottom:0!important;
  height:58px!important;
  min-height:58px!important;
  flex-basis:58px!important;
  z-index:9990!important;
  margin:0!important;
  padding:0!important;
  background:rgba(255,255,255,.96)!important;
  border-top:1px solid #dce5ea!important;
  box-shadow:0 -3px 12px rgba(13,43,71,.07)!important;
  pointer-events:none!important;
}
.controls .side{pointer-events:none!important}
.controls #prev,.controls #next,.controls #counter{pointer-events:auto!important}

/* نترك حيزًا ثابتًا أسفل المحتوى حتى لا يركب العداد على السؤال أو النص */
.slide{
  padding-bottom:76px!important;
  box-sizing:border-box!important;
}

/* دعم الشاشات القصيرة والموبايل */
@media(max-width:720px){
  html,body{min-height:100dvh!important}
  .app,.stage{min-height:100dvh!important;height:100dvh!important}
  .slide{padding-bottom:78px!important}
  #count,#counter{
    bottom:max(13px,env(safe-area-inset-bottom))!important;
    font-size:10.5px!important;
    padding:5px 9px!important;
  }
  #prev,#next{
    bottom:max(8px,env(safe-area-inset-bottom))!important;
    min-width:66px!important;
    min-height:40px!important;
    padding:7px 10px!important;
    font-size:12px!important;
  }
}
</style>

<button id="fs" title="ملء الشاشة">⛶</button>
<button id="prev" class="nav">السابق</button>
<div id="count">1 / 15</div>
<button id="next" class="nav">التالي</button>

<script>
const slides=[...document.querySelectorAll('.slide')];
let i=0;
const count=document.getElementById('count');
const progress=document.getElementById('progress');
function show(n){
  i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,k)=>s.classList.toggle('active',k===i));
  count.textContent=(i+1)+' / '+slides.length;
  progress.style.width=((i+1)/slides.length*100)+'%';
  document.getElementById('prev').style.visibility=i===0?'hidden':'visible';
  document.getElementById('next').textContent=i===slides.length-1?'النهاية':'التالي';
}
document.getElementById('next').onclick=()=>{if(i<slides.length-1)show(i+1)};
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('fs').onclick=async()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='PageDown'||e.key===' ') show(i+1);
  if(e.key==='ArrowRight'||e.key==='PageUp') show(i-1);
});
show(0);
</script>
