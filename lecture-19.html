<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الانضباط المدرسي - 15 شريحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Tahoma,Arial,sans-serif}
.slide{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  background:#fff;
}
.slide.active{display:flex}
.slide img{
  width:100vw;height:100vh;
  object-fit:contain;
  object-position:center;
  display:block;
  background:#fff;
}
#progress{
  position:fixed;top:0;right:0;height:4px;
  background:#0d2b47;z-index:20;transition:width .2s ease;
}
.nav{
  position:fixed;bottom:10px;z-index:30;
  border:0;border-radius:12px;padding:9px 15px;
  font-weight:800;font-size:14px;cursor:pointer;
  opacity:.72;backdrop-filter:blur(6px);
}
#prev{left:12px;background:rgba(255,255,255,.90);color:#173044;border:1px solid #d7e1e7}
#next{right:12px;background:rgba(13,43,71,.92);color:white}
#count{
  position:fixed;left:50%;bottom:11px;transform:translateX(-50%);
  z-index:30;background:rgba(255,255,255,.92);color:#173044;
  border:1px solid #d7e1e7;border-radius:999px;padding:6px 11px;
  font-size:13px;font-weight:800;
}
#fs{
  position:fixed;left:10px;top:10px;z-index:30;
  width:36px;height:36px;border:1px solid #d7e1e7;border-radius:10px;
  background:rgba(255,255,255,.86);color:#173044;font-size:18px;cursor:pointer;
  opacity:.68;
}
@media(max-width:700px){
  .nav{bottom:7px;padding:8px 12px;font-size:12px}
  #count{bottom:8px;font-size:12px}
}
</style>
</head>
<body>
<div id="progress"></div>

<section class="slide active" data-index="1">
  <img src="defe0ec70da64a4dea43.png" alt="الانضباط المدرسي - الشريحة 1">
</section>

<section class="slide " data-index="2">
  <img src="834d92aeac8d6c3700ab.png" alt="الانضباط المدرسي - الشريحة 2">
</section>

<section class="slide " data-index="3">
  <img src="ddcde8ff4d03835b9eac.png" alt="الانضباط المدرسي - الشريحة 3">
</section>

<section class="slide " data-index="4">
  <img src="8d4e5004bad45c9040e9.png" alt="الانضباط المدرسي - الشريحة 4">
</section>

<section class="slide " data-index="5">
  <img src="aee7856e627e6b337ff7.png" alt="الانضباط المدرسي - الشريحة 5">
</section>

<section class="slide " data-index="6">
  <img src="2d0651389d808f6fa261.png" alt="الانضباط المدرسي - الشريحة 6">
</section>

<section class="slide " data-index="7">
  <img src="cf3df20e326d525a375c.png" alt="الانضباط المدرسي - الشريحة 7">
</section>

<section class="slide " data-index="8">
  <img src="8982bdabb3895fced339.png" alt="الانضباط المدرسي - الشريحة 8">

<section class="slide " data-index="9">
  <img src="4a9f7c87c23175e10ee5.png" alt="الانضباط المدرسي - الشريحة 9">

<section class="slide " data-index="10">
  <img src="b5a8f5197c58d28fb9eb.png" alt="الانضباط المدرسي - الشريحة 10">
</section>

<section class="slide " data-index="11">
  <img src="602ed5fae4d7998363f2.png" alt="الانضباط المدرسي - الشريحة 11">

<section class="slide " data-index="12">
  <img src="1270a1d174a264bd3423.png" alt="الانضباط المدرسي - الشريحة 12">

<section class="slide " data-index="13">
  <img src="ae5eafed079bb13699bc.png" alt="الانضباط المدرسي - الشريحة 13">

  <img src="bef21e47073bb10348bc.png" alt="الانضباط المدرسي - الشريحة 14">
</section>

<section class="slide " data-index="15">
  <img src="08c83ff666f0393a39cc.png" alt="الانضباط المدرسي - الشريحة 15">
</section>

<button id="fs" title="ملء الشاشة">⛶</button>
<button id="prev" class="nav">السابق</button>
<div id="count">1 / 15</div>
<button id="next" class="nav">التالي</button>

<script>
const slides=[...document.querySelectorAll('.slide')];
let i=0;
const count=document.getElementById('count');
const progress=document.getElementById('progress');
function show(n){
  i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,k)=>s.classList.toggle('active',k===i));
  count.textContent=(i+1)+' / '+slides.length;
  progress.style.width=((i+1)/slides.length*100)+'%';
  document.getElementById('prev').style.visibility=i===0?'hidden':'visible';
  document.getElementById('next').textContent=i===slides.length-1?'النهاية':'التالي';
}
document.getElementById('next').onclick=()=>{if(i<slides.length-1)show(i+1)};
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('fs').onclick=async()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='PageDown'||e.key===' ') show(i+1);
  if(e.key==='ArrowRight'||e.key==='PageUp') show(i-1);
});
show(0);
</script>
</body>
</html>
